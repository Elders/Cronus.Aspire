---
variables:
  - group: elders-nuget
  - name: PROJECT_DIR
    value: Elders.Cronus.Aspire
  - name: INITIAL_VERSION
    value: 12.0.0

trigger:
  branches:
    include: [master,beta,preview]
  paths:
    exclude: [CHANGELOG.md]

pool:
  vmImage: ubuntu-latest

stages:
- stage : DeployStage
  displayName: 'Deploy stage'

  jobs:
  - job: build_pack_publish

    steps:
    - checkout: self
      clean: true
      persistCredentials: true
      fetchDepth: 0
      fetchTags: true

    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.x'
        includePreviewVersions: false

    - task: DotNetCoreCLI@2
      name: build
      inputs:
        command: build
        projects: 'src/$(PROJECT_DIR)/*.csproj'

    - task: Bash@3
      name: initial_release
      displayName: initial v12 package bootstrap
      condition: eq(variables['Build.SourceBranch'], 'refs/heads/master')
      env:
        STAGING_PATH: $(Build.StagingDirectory)
      inputs:
        targetType: 'inline'
        script: |
          set -e

          INITIAL_TAG="v$(INITIAL_VERSION)"

          if git rev-parse "$INITIAL_TAG" >/dev/null 2>&1; then
            echo "Initial release tag $INITIAL_TAG already exists. Skipping bootstrap."
            echo "##vso[task.setvariable variable=skipSemanticRelease;]no"
            exit 0
          fi

          dotnet pack "src/$(PROJECT_DIR)/"*.csproj -o "$STAGING_PATH" -p:Configuration=Release -p:PackageVersion=$(INITIAL_VERSION) --verbosity Detailed
          git tag "$INITIAL_TAG"

          echo "##vso[build.updatebuildnumber]$(INITIAL_VERSION)"
          echo "##vso[task.setvariable variable=initialRelease;]yes"
          echo "##vso[task.setvariable variable=newVer;]yes"
          echo "##vso[task.setvariable variable=skipSemanticRelease;]yes"

    - task: Bash@3
      name: release
      displayName: semantic release + pack
      condition: ne(variables['skipSemanticRelease'], 'yes')
      env:
        STAGING_PATH: $(Build.StagingDirectory)
      inputs:
        targetType: 'inline'
        script: |
          time curl -L https://github.com/Elders/blob/releases/download/SemRel-01/node_modules.tar.gz | 
          tar -xzv
          time npx semantic-release --no-ci
          # few commands for debugging purposes
          ls -l $STAGING_PATH/*.nupkg
          echo dotnet msbuild `dotnet msbuild --version`
          echo dotnet nuget `dotnet nuget --version`
          echo dotnet `dotnet --version`

    - task: Bash@3
      name: publish
      displayName: nuget push to nuget.org
      condition: and(eq(variables['newVer'], 'yes'), succeeded())
      inputs:
        targetType: 'inline'
        script: 'dotnet nuget push $(Build.StagingDirectory)/*.nupkg --api-key $(NUGET_KEY) --source https://api.nuget.org/v3/index.json --skip-duplicate'

    - task: Bash@3
      name: push_initial_tag
      displayName: push initial release tag
      condition: and(eq(variables['initialRelease'], 'yes'), succeeded())
      inputs:
        targetType: 'inline'
        script: 'git push origin v$(INITIAL_VERSION)'
